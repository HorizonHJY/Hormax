[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hormax"
version = "0.1.0"
description = "Python package for financial data analysis and stock pack generation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Hormax Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "yfinance>=0.2.32",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "requests-cache>=1.1.0",
    "requests>=2.31.0",
    # Newey-West (HAC) standard errors for factor-exposure regressions.
    # Hand-rolling a HAC covariance estimator is exactly the kind of thing
    # that is subtly wrong for years without anyone noticing.
    "statsmodels>=0.14.0",
    # Parquet cache for the Ken French factor files (updated monthly, so
    # refetching on every call is pure waste).
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "freezegun>=1.2.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
]


# 显式声明包发现范围。不能依赖 setuptools 的自动发现：仓库根还有
# demo_stock_pack.py、config/、tests/、specs/ 等非包内容，flat-layout
# 自动发现会把它们一起当成顶层包，直接构建失败。
[tool.setuptools.packages.find]
where = ["."]
include = ["hormax*"]
exclude = ["tests*", "specs*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=hormax --cov-report=html --cov-report=term-missing"
